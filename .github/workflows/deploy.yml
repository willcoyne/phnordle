name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a queued deploy wait for the running one rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Gates the deploy: re-tokenises all 102,236 shipped entries and checks the
      # marking and daily-pick logic. A bad word list never reaches the site.
      - name: Self-checks
        run: node scripts/test.mjs

      # Publish only what the game loads. The source dictionary (3.1 MB), the
      # cheat-sheet PDF and the notes stay out of the artifact.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src data _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
